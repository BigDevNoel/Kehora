[project]
name = "kehora-common"
version = "0.0.0"
description = "Shared settings, logging, IDs and feature flags for Kehora backend services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "structlog==26.1.0",
    "uuid-utils==1.2.0",
    "boto3==1.43.122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kehora_common"]
