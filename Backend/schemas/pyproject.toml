[project]
name = "kehora-schemas"
version = "0.0.0"
description = "Pydantic models generated from Backend/schemas/*.schema.json (make codegen)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kehora_schemas"]
