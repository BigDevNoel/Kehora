[project]
name = "kehora-db"
version = "0.0.0"
description = "SQLAlchemy models and Alembic migrations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kehora-common",
    "kehora-schemas",
    "sqlalchemy[asyncio]==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary,pool]==3.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kehora_db"]
