[project]
name = "kehora-agents"
version = "0.0.0"
description = "LangGraph build graphs and the ARQ run worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kehora-common",
    "kehora-db",
    "kehora-schemas",
    "kehora-llm",
    "kehora-engines",
    "kehora-engines-runner",
    "langgraph==1.2.18",
    "langgraph-checkpoint-postgres==3.2.0",
    "langsmith==0.14.16",
    "psycopg[binary,pool]==3.3.6",
    "arq==0.28.0",
    "redis==5.3.1",
    "sentry-sdk==2.73.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kehora_agents"]
