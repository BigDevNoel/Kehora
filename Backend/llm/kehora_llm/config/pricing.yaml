# USD per 1M tokens. Used only for cost logging (cost_usd_micros = tokens * price).
# A model missing here is logged with cost null and a warning; add it before routing traffic.
# Anthropic: first-party API list prices as of 2026-10. cache_write = 1.25 x input (5-min TTL).
models:
  anthropic/claude-opus-5-5: {input: "4.00", output: "20.00", cache_read: "0.20", cache_write: "5.00"}
  anthropic/claude-sonnet-5-5: {input: "2.00", output: "10.00", cache_read: "0.20", cache_write: "2.50"}
  anthropic/claude-haiku-5-5: {input: "0.10", output: "0.50", cache_read: "0.01", cache_write: "0.125"}
  # OpenAI fallback prices are intentionally absent until confirmed from the OpenAI price page.
  fake/fake-small: {input: "0", output: "0", cache_read: "0", cache_write: "0"}
  fake/fake-large: {input: "0", output: "0", cache_read: "0", cache_write: "0"}
