[project]
name = "kehora-engines-runner"
version = "0.0.0"
description = "Runs engines inside SandboxProvider sandboxes"
requires-python = ">=3.12,<3.13"
dependencies = ["kehora-common", "kehora-engines", "kehora-schemas", "docker==7.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kehora_engines_runner"]
