[project]
name = "kehora-api"
version = "0.0.0"
description = "Kehora FastAPI service: validates, stores, enqueues runs and streams events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kehora-common",
    "kehora-db",
    "kehora-schemas",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
    "svix==2.9.1",
    "redis==5.3.1",
    "arq==0.28.0",
    "sse-starlette==3.6.0",
    "sentry-sdk[fastapi]==2.73.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kehora_api"]
