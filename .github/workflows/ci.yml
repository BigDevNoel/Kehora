name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: Backend/uv.lock

      - uses: pnpm/action-setup@v6
        with:
          version: "9.12.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml

      - name: Write .env from .env.example and repository secrets
        env:
          CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: |
          cp .env.example .env
          for key in CLERK_ISSUER CLERK_SECRET_KEY CLERK_WEBHOOK_SIGNING_SECRET \
                     VITE_CLERK_PUBLISHABLE_KEY E2E_CLERK_USER_EMAIL; do
            sed -i "s|^${key}=.*|${key}=${!key}|" .env
          done

      - name: make check
        run: make check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: Frontend/playwright-report
          if-no-files-found: ignore

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color api worker | tail -n 300
